[package]
name = "splits-distributor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust crate for interacting with 0xSplits contracts - split discovery, balance checking, and distribution execution"
repository = "https://github.com/orkid-labs/splits-distributor"
keywords = ["0xSplits", "ethereum", "defi", "distribution"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[lib]
name = "splits_distributor"
path = "src/lib.rs"

[dependencies]
alloy = { version = "1.8", features = ["sol-types", "rpc", "providers", "signers"] }
alloy-primitives = { version = "=1.5.7", features = ["serde"] }
alloy-sol-types = { version = "=1.5.7" }
alloy-rpc-types = { version = "=1.8.2" }
anyhow = "1.0"
chrono = "0.4"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
scraper = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

alloy-sol-type-parser = "=1.5.7"

[dev-dependencies]
